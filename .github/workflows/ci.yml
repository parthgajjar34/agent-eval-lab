name: Validate project

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src/ tests/
      - run: python -m mypy src/agent_eval
      - run: python -m pytest
      - run: agent-eval doctor -b benchmarks/py-customers
      - run: agent-eval evaluate -c examples/demo.yaml
      - run: agent-eval report -c examples/demo.yaml
